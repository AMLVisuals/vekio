name: Supabase keep-alive

# Empeche la mise en pause du projet Supabase (free tier : pause apres 7 jours
# sans activite DB). On ping l'endpoint REST, qui compte comme une vraie requete
# base de donnees — contrairement a /auth/v1/health.
on:
  schedule:
    # Lundi et jeudi a 08:00 UTC (2x/semaine, large marge sous les 7 jours).
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -sSf \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://mwbrwppbwucbeardeyyc.supabase.co/rest/v1/produits_communaute?select=count&limit=1"
        env:
          # Cle anon (publique par design — deja livree dans l'app cliente).
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13YnJ3cHBid3VjYmVhcmRleXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODE3ODYsImV4cCI6MjA5Mjg1Nzc4Nn0.KoGgjqsPbzZBgaBMMdFfbE1S1oNaHOmHdkEZyWHQJBs
