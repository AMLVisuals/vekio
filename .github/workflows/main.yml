      steps:
        - name: Ping Supabase auth endpoint
          run: |
            set -e
            URL="https://mwbrwppbwucbeardeyyc.supabase.co/auth/v1/health"
            KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13YnJ3cHBid3VjYmVhcmRleXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyO
  DE3ODYsImV4cCI6MjA5Mjg1Nzc4Nn0.KoGgjqsPbzZBgaBMMdFfbE1S1oNaHOmHdkEZyWHQJBs"
            STATUS=$(curl -s -o response.json -w "%{http_code}" -H "apikey: $KEY" "$URL")
